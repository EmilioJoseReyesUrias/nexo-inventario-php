name: Desplegar PHP en Alwaysdata

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_DEPLOY_KEY }}
          SSH_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          set -e
          test -n "$SSH_KEY"
          test -n "$SSH_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Actualizar Nexo Inventario
        run: |
          ssh -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -i ~/.ssh/id_ed25519 \
              unkcode@ssh-unkcode.alwaysdata.net \
              'cd ~/www/nexo-inventario-php && git pull --ff-only origin main'

      - name: Confirmar despliegue
        run: |
          echo "Despliegue PHP completado"
